<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plot twist card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFD600; color: #0B0B0D; font-family: 'Archivo', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: #0B0B0D"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #FFD600; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="About this card" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 128px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1.4px">ONE MORE THING</div>
<h1 style="margin: 0; font-size: 96px; line-height: 0.82; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -2px">Plot twist.</h1>
<div style="font-size: 26px; line-height: 1.12; font-weight: 800; max-width: 330px">In June you fell into ceramics and never climbed out.</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 470px; height: 230px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700">Ceramics posts you liked and saved, by month</div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 5px; align-items: end">
<sc-for list="{{months}}" as="m" hint-placeholder-count="11"><div style="height: {{m.h}}; background: {{m.fill}}; border-radius: 3px 3px 0 0"></div></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 5px; font-size: 10px; font-weight: 800; text-align: center">
<sc-for list="{{months}}" as="m" hint-placeholder-count="11"><span>{{m.label}}</span></sc-for>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; align-items: center; gap: 12px">
<div style="font-size: 13px; font-weight: 600">Measured · likes and saves</div>
<button style="display: flex; align-items: center; gap: 8px; background: #0B0B0D; color: #FFFFFF; border: none; border-radius: 999px; padding: 0 20px 0 16px; height: 50px; font-family: inherit; font-size: 15px; font-weight: 800; white-space: nowrap"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M21.5 3.5 2.8 10.4l7.4 3 3 7.4z"></path><path d="M21.5 3.5 10.2 13.4"></path></svg>Share</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i <= 9 ? '#0B0B0D' : 'rgba(11,11,13,0.25)' }));
const vals = [3, 2, 4, 3, 5, 22, 41, 58, 64, 71, 80];
const labels = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N'];
const months = vals.map((v, i) => ({ label: labels[i], h: Math.max(4, Math.round(v / 80 * 100)) + '%', fill: i >= 5 ? '#0B0B0D' : 'rgba(11,11,13,0.25)' }));
return { bars, months };
}
}
</script>
</body>
</html>
