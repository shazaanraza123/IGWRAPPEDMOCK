<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personality teaser card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#0B0B0D}a:hover{color:#0B0B0D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0B0D; color: #FFFFFF; font-family: 'Archivo', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: conic-gradient(from 200deg, #FFD600, #FF7A00, #FF0069, #D300C5, #7638FA, #FFD600)"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #0B0B0D; box-sizing: border-box; background: #0B0B0D; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="Pause" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 128px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1.4px; color: #FF5C9A">BEFORE WE TELL YOU</div>
<h1 style="margin: 0; font-size: 46px; line-height: 0.86; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -1px">Three clues. One personality.</h1>
</div>
<svg role="img" aria-label="Eight dim personality marks circling a question mark" width="250" height="250" viewBox="0 0 250 250" style="position: absolute; left: 70px; top: 284px">
<sc-for list="{{orbit}}" as="o" hint-placeholder-count="8"><circle cx="{{o.x}}" cy="{{o.y}}" r="19" fill="{{o.fill}}" fill-opacity="0.35"></circle></sc-for>
<circle cx="125" cy="125" r="62" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="14 9"></circle>
<text x="125" y="150" text-anchor="middle" font-family="Archivo, sans-serif" font-size="78" font-weight="900" fill="#FFFFFF">?</text>
</svg>
<div style="position: absolute; left: 20px; right: 20px; top: 548px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{clues}}" as="c" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; background: #1E1E22; border-radius: 14px; padding: 12px 14px">
<span style="font-size: 12px; font-weight: 900; color: #FF5C9A">{{c.n}}</span>
<span style="font-size: 16px; font-weight: 700">{{c.text}}</span>
</div>
</sc-for>
</div>
<a href="P16-Personality.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 26px; height: 54px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 900; text-decoration: none">Reveal my personality<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i <= 10 ? '#FFFFFF' : 'rgba(255,255,255,0.3)' }));
const colors = ['#D300C5', '#A1A1AA', '#FF7A00', '#FFD600', '#27C866', '#7638FA', '#FF0069', '#F7F3EC'];
const orbit = colors.map((fill, i) => {
const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
return { fill, x: (125 + Math.cos(a) * 100).toFixed(1), y: (125 + Math.sin(a) * 100).toFixed(1) };
});
const clues = [
{ n: '01', text: 'You saved 1,214 posts' },
{ n: '02', text: 'You posted 38 times all year' },
{ n: '03', text: 'You watched 96% of friends’ Stories' }
];
return { bars, orbit, clues };
}
}
</script>
</body>
</html>
