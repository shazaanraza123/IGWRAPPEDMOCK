<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story that broke the group chat card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #27C866; color: #0B0B0D; font-family: 'Archivo', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: #0B0B0D"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #27C866; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="About this card" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 128px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1.4px">YOUR MOMENTS</div>
<h1 style="margin: 0; font-size: 56px; line-height: 0.86; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -1px">The Story that broke the group chat.</h1>
</div>
<div style="position: absolute; left: 28px; top: 340px; width: 176px; height: 312px; border-radius: 16px; padding: 4px; box-sizing: border-box; background: conic-gradient(from 200deg, #FFD600, #FF7A00, #FF0069, #D300C5, #7638FA, #FFD600); transform: rotate(-4deg); box-shadow: 0 18px 40px rgba(11,11,13,0.3)">
<div style="width: 100%; height: 100%; border-radius: 12px; overflow: hidden; position: relative; background: linear-gradient(165deg, #8f7ab8, #352a4f)">
<div style="position: absolute; left: 8px; right: 8px; top: 8px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.85)"></div>
<span style="position: absolute; left: 10px; bottom: 10px; font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.5px; color: rgba(255,255,255,0.8)">STORY · MAR 14</span>
</div>
</div>
<div style="position: absolute; right: 22px; top: 352px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
<sc-for list="{{bubbles}}" as="u" hint-placeholder-count="5"><div style="width: {{u.w}}; height: 30px; border-radius: 15px 15px 4px 15px; background: {{u.bg}}"></div></sc-for>
</div>
<div style="position: absolute; left: 216px; right: 20px; top: 556px; display: flex; flex-direction: column">
<span style="font-size: 76px; line-height: 0.85; font-weight: 900; font-stretch: 62%; letter-spacing: -2px">47</span>
<span style="font-size: 17px; font-weight: 800">replies in a day</span>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 694px; font-size: 15px; font-weight: 600">Your most-replied Story of the year. Who said what stays in your DMs.</div>
<button style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: #0B0B0D; color: #FFFFFF; border: none; border-radius: 999px; padding: 0 22px 0 18px; height: 50px; font-family: inherit; font-size: 15px; font-weight: 800; white-space: nowrap"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M21.5 3.5 2.8 10.4l7.4 3 3 7.4z"></path><path d="M21.5 3.5 10.2 13.4"></path></svg>Share this story</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i <= 6 ? '#0B0B0D' : 'rgba(11,11,13,0.25)' }));
const bubbles = [
{ w: '120px', bg: '#0B0B0D' },
{ w: '84px', bg: '#FFFFFF' },
{ w: '140px', bg: '#0B0B0D' },
{ w: '64px', bg: '#FFFFFF' },
{ w: '104px', bg: '#0B0B0D' }
];
return { bars, bubbles };
}
}
</script>
</body>
</html>
