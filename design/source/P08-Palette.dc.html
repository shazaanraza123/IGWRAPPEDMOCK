<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feed palette card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F3EC; color: #0B0B0D; font-family: 'Archivo', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: conic-gradient(from 200deg, #FFD600, #FF7A00, #FF0069, #D300C5, #7638FA, #FFD600)"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #F7F3EC; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="About this card" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 128px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1.4px; color: #6B21A8">YOUR HABITS</div>
<h1 style="margin: 0; font-size: 66px; line-height: 0.86; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -1.5px">Your feed had a color.</h1>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 286px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{grid}}" as="g" hint-placeholder-count="9"><div style="aspect-ratio: 1; background: {{g.fill}}"></div></sc-for>
</div>
<div style="position: absolute; right: 14px; top: 590px; transform: rotate(-4deg); background: #0B0B0D; color: #FFFFFF; border-radius: 12px; padding: 9px 14px; display: flex; flex-direction: column; box-shadow: 0 10px 24px rgba(11,11,13,0.3)">
<span style="font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #FFD600">YOUR PALETTE</span>
<span style="font-size: 26px; line-height: 1; font-weight: 900; font-stretch: 62%; text-transform: uppercase">Midnight Camel</span>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 650px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="height: 30px; border-radius: 6px; background: {{s.hex}}; box-shadow: inset 0 0 0 1px rgba(11,11,13,0.12)"></div>
<div style="font-size: 18px; font-weight: 900; font-stretch: 70%">{{s.share}}</div>
<div style="font-family: ui-monospace, monospace; font-size: 10px">{{s.hex}}</div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; align-items: center; gap: 12px">
<div style="font-size: 13px; font-weight: 600">% = main color in each of 1,840 liked posts</div>
<button style="display: flex; align-items: center; gap: 8px; background: #0B0B0D; color: #FFFFFF; border: none; border-radius: 999px; padding: 0 20px 0 16px; height: 50px; font-family: inherit; font-size: 15px; font-weight: 800; white-space: nowrap"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M21.5 3.5 2.8 10.4l7.4 3 3 7.4z"></path><path d="M21.5 3.5 10.2 13.4"></path></svg>Share</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i <= 2 ? '#0B0B0D' : 'rgba(11,11,13,0.2)' }));
const t = (a, b) => 'linear-gradient(150deg, ' + a + ', ' + b + ')';
const grid = [
t('#2B3A5E', '#141C30'), t('#D2B08C', '#9C7A58'), t('#2B3A5E', '#141C30'),
t('#9E4545', '#5E2424'), t('#EFE7DA', '#CFC3AF'), t('#D2B08C', '#9C7A58'),
t('#5E7D59', '#33472F'), t('#2B3A5E', '#141C30'), t('#9E4545', '#5E2424')
].map((fill) => ({ fill }));
const swatches = [
{ hex: '#1F2A44', share: '31%' },
{ hex: '#C8A27C', share: '24%' },
{ hex: '#8B3A3A', share: '19%' },
{ hex: '#E9E1D3', share: '15%' },
{ hex: '#4E6B4A', share: '11%' }
];
return { bars, grid, swatches };
}
}
</script>
</body>
</html>
