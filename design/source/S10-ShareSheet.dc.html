<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Archivo', sans-serif">
<div style="position: absolute; inset: 0">
<dc-import name="IdentityCard" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.62)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; box-sizing: border-box; background: #121214; border-radius: 26px 26px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3F3F46"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 22px; font-weight: 900; font-stretch: 80%">Share your Wrapped</h2>
<a href="IdentityCard.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #1E1E22; border-radius: 12px">
<button style="font-family: inherit; font-size: 14px; font-weight: 800; color: #0B0B0D; background: #FFFFFF; border: none; border-radius: 9px; height: 40px">Identity card</button>
<button style="font-family: inherit; font-size: 14px; font-weight: 600; color: #D4D4D8; background: none; border: none; border-radius: 9px; height: 40px">Numbers card</button>
</div>
<div style="display: flex; gap: 16px">
<div style="width: 112px; height: 242px; flex-shrink: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px #3F3F46">
<div style="width: 390px; height: 844px; transform: scale(0.2872); transform-origin: top left">
<dc-import name="IdentityCard" hint-size="390px,844px"></dc-import>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: #A1A1AA">FORMAT</div>
<button style="font-family: inherit; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; color: #0B0B0D; background: #FFFFFF; border: none; border-radius: 10px; padding: 0 12px; height: 44px">Story<span style="font-weight: 600; color: #52525B">9:16</span></button>
<button style="font-family: inherit; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; color: #FFFFFF; background: none; border: 1px solid #3F3F46; border-radius: 10px; padding: 0 12px; height: 44px">Post<span style="font-weight: 500; color: #A1A1AA">4:5</span></button>
<button style="font-family: inherit; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; color: #FFFFFF; background: none; border: 1px solid #3F3F46; border-radius: 10px; padding: 0 12px; height: 44px">Square<span style="font-weight: 500; color: #A1A1AA">1:1</span></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: #A1A1AA">STYLE</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{styles}}" as="s" hint-placeholder-count="4">
<button style="font-family: inherit; display: flex; flex-direction: column; gap: 6px; background: none; border: none; padding: 0; color: #FFFFFF; font-size: 11px; font-weight: 700; text-align: left">
<span style="display: block; width: 100%; height: 44px; border-radius: 8px; background: {{s.swatch}}; box-shadow: {{s.ring}}"></span>{{s.name}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: #A1A1AA">SHOW ON CARD</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button style="font-family: inherit; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: {{c.ink}}; background: {{c.bg}}; border: {{c.border}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<a href="InStory.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; text-decoration: none">
<span style="width: 58px; height: 58px; border-radius: 50%; padding: 2.5px; box-sizing: border-box; background: conic-gradient(from 200deg, #FFD600, #FF7A00, #FF0069, #D300C5, #7638FA, #FFD600); display: flex"><span style="width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid #121214; box-sizing: border-box; background: #1E1E22; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2"><path d="M12 5v14M5 12h14"></path></svg></span></span>Your story</a>
<button style="font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 0">
<span style="width: 58px; height: 58px; border-radius: 50%; background: #1E1E22; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linejoin="round"><path d="M21.5 3.5 2.8 10.4l7.4 3 3 7.4z"></path><path d="M21.5 3.5 10.2 13.4"></path></svg></span>Send</button>
<button style="font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 0">
<span style="width: 58px; height: 58px; border-radius: 50%; background: #1E1E22; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></span>Save</button>
<button style="font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 0">
<span style="width: 58px; height: 58px; border-radius: 50%; background: #1E1E22; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"></path><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"></path></svg></span>Copy link</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const styles = [
{ name: 'Bold', swatch: 'linear-gradient(135deg, #D300C5 50%, #0B0B0D 50%)', ring: '0 0 0 2px #FFFFFF' },
{ name: 'Scrapbook', swatch: 'linear-gradient(135deg, #E9DCC4, #B98E62)', ring: 'none' },
{ name: 'Numbers', swatch: 'linear-gradient(135deg, #0B0B0D 60%, #FFD600 60%)', ring: 'none' },
{ name: 'Photo Film', swatch: 'linear-gradient(135deg, #3b1f3f, #c0617a)', ring: 'none' }
];
const on = { ink: '#0B0B0D', bg: '#FFFFFF', border: 'none' };
const off = { ink: '#A1A1AA', bg: 'none', border: '1px dashed #52525B' };
const chips = [
{ label: '✓ @handle', ...on },
{ label: '✓ Saves', ...on },
{ label: '+ Second personality', ...off },
{ label: '+ Cover photo', ...off }
];
return { styles, chips };
}
}
</script>
</body>
</html>
