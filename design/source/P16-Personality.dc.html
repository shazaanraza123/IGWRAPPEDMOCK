<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personality card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFD600}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #D300C5; color: #FFFFFF; font-family: 'Archivo', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: #FFFFFF"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #D300C5; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="About this card" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<svg role="img" aria-label="The Curator mark: three stacked saved bookmarks inside a story ring" width="184" height="184" viewBox="0 0 230 230" style="position: absolute; left: 103px; top: 112px">
<circle cx="115" cy="115" r="104" fill="none" stroke="#0B0B0D" stroke-width="14" stroke-dasharray="44 10.5"></circle>
<circle cx="115" cy="115" r="84" fill="#0B0B0D"></circle>
<path d="M68 70h44v74l-22-15-22 15z" fill="#FFD600"></path>
<path d="M93 80h44v74l-22-15-22 15z" fill="#FF7A00"></path>
<path d="M118 90h44v74l-22-15-22 15z" fill="#FFFFFF"></path>
</svg>
<div style="position: absolute; left: 20px; right: 20px; top: 312px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1.4px">YOUR INSTAGRAM PERSONALITY</div>
<h1 style="margin: 0; font-size: 100px; line-height: 0.82; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -2px">The<br>Curator</h1>
<div style="font-size: 17px; font-weight: 600">with a side of <span style="font-weight: 900">The Ghost</span></div>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 560px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; height: 12px; gap: 3px"><div style="flex: 70; background: #0B0B0D; border-radius: 6px 0 0 6px"></div><div style="flex: 30; background: rgba(255,255,255,0.55); border-radius: 0 6px 6px 0"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span>70% Curator match</span><span>30% Ghost match</span></div>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 616px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px; border-top: 2px solid #0B0B0D; padding-top: 8px">
<span style="font-size: 26px; font-weight: 900; font-stretch: 70%">{{r.value}}</span>
<span style="font-size: 12px; font-weight: 600; line-height: 1.25">{{r.label}}</span>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<a href="S10-ShareSheet.dc.html" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #0B0B0D; color: #FFFFFF; border-radius: 999px; height: 52px; font-size: 16px; font-weight: 800; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M21.5 3.5 2.8 10.4l7.4 3 3 7.4z"></path><path d="M21.5 3.5 10.2 13.4"></path></svg>Share your personality</a>
<a href="IdentityCard.dc.html" style="font-size: 14px; font-weight: 700; padding: 10px; text-decoration: none">See your share cards</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i <= 11 ? '#FFFFFF' : 'rgba(255,255,255,0.35)' }));
const reasons = [
{ value: '1,214', label: 'posts saved' },
{ value: '38', label: 'posts all year' },
{ value: '96%', label: 'of friends’ Stories watched' }
];
return { bars, reasons };
}
}
</script>
</body>
</html>
