<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wrapped opening card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FF0069; color: #0B0B0D; font-family: 'Archivo', sans-serif">
<svg aria-hidden="true" width="330" height="330" viewBox="0 0 330 330" style="position: absolute; right: -120px; bottom: -150px">
<defs><linearGradient id="op" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD600"></stop><stop offset="0.5" stop-color="#FF7A00"></stop><stop offset="1" stop-color="#7638FA"></stop></linearGradient></defs>
<circle cx="165" cy="165" r="146" fill="none" stroke="url(#op)" stroke-width="30"></circle>
<circle cx="165" cy="165" r="106" fill="none" stroke="#0B0B0D" stroke-width="3"></circle>
<circle cx="165" cy="165" r="86" fill="none" stroke="#0B0B0D" stroke-width="12" stroke-dasharray="34 11"></circle>
</svg>
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: #0B0B0D"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #FF0069; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="Pause" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 132px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<img src="../photos/tile-1.jpg" alt="Brunch skillet on a table" style="display: block; width: 100%; aspect-ratio: 1; object-fit: cover">
<div style="aspect-ratio: 1; background: #0B0B0D"></div>
<img src="../photos/tile-2.jpg" alt="City skyline at night" style="display: block; width: 100%; aspect-ratio: 1; object-fit: cover">
<img src="../photos/tile-3.jpg" alt="Friends dancing at a show" style="display: block; width: 100%; aspect-ratio: 1; object-fit: cover">
<img src="../photos/tile-4.jpg" alt="Friends hiking" style="display: block; width: 100%; aspect-ratio: 1; object-fit: cover">
<img src="../photos/tile-5.jpg" alt="Man standing on a rooftop" style="display: block; width: 100%; aspect-ratio: 1; object-fit: cover">
</div>
<div style="position: absolute; left: 133px; top: 125px; width: 124px; height: 124px; box-sizing: border-box; border: 5px solid #0B0B0D; background: #0B0B0D; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; color: #FFFFFF">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 1px">YOUR YEAR</span>
<span style="font-size: 64px; line-height: 0.8; font-weight: 900; font-stretch: 62%; letter-spacing: -2px; color: #FF0069">2026</span>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 392px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 20px; font-weight: 900">@maya.lens</div>
<h1 style="margin: 0; font-size: 72px; line-height: 0.86; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -1.5px">2026 looked good on you.</h1>
<div style="font-size: 16px; line-height: 1.35; font-weight: 500; max-width: 270px">Built from your own posts and Stories, Jan 1 to Nov 15.</div>
</div>
<div style="position: absolute; left: 20px; bottom: 40px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800">Tap to start <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i === 0 ? '#0B0B0D' : 'rgba(11,11,13,0.25)' }));
return { bars };
}
}
</script>
</body>
</html>
