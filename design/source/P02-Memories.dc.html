<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Year in memories card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0B0D; color: #FFFFFF; font-family: 'Archivo', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: conic-gradient(from 200deg, #FFD600, #FF7A00, #FF0069, #D300C5, #7638FA, #FFD600)"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #0B0B0D; box-sizing: border-box; background: #0B0B0D; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="Pause" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 128px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1.4px; color: #FF5C9A">YOUR YEAR IN MEMORIES</div>
<h1 style="margin: 0; font-size: 60px; line-height: 0.86; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -1.2px">You had quite a year.</h1>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 280px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{months}}" as="m" hint-placeholder-count="11">
<div style="aspect-ratio: 1; position: relative; background: {{m.tone}}; box-shadow: {{m.ring}}">
<span style="position: absolute; left: 6px; top: 6px; background: {{m.chipBg}}; color: {{m.chipInk}}; font-size: 10px; font-weight: 900; letter-spacing: 0.6px; border-radius: 4px; padding: 3px 6px">{{m.label}}</span>
</div>
</sc-for>
<a href="P08-Palette.dc.html" style="aspect-ratio: 1; background: #FF0069; color: #0B0B0D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M7 4.5v15l12-7.5z"></path></svg></span>
<span style="font-size: 12px; font-weight: 900; text-align: center; line-height: 1.1">PLAY YOUR<br>YEAR · 0:15</span>
</a>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 756px; font-size: 15px; font-weight: 600; color: #D4D4D8">August was your busiest month: 9 posts, 61 Stories.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i <= 1 ? '#FFFFFF' : 'rgba(255,255,255,0.3)' }));
const tones = ['#5b7fa6,#243447', '#d8c3a5,#8a6f52', '#c0617a,#3b1f3f', '#6b8a6a,#2c3b2b', '#b4835a,#5a3a24', '#8f7ab8,#352a4f', '#e0a96d,#7a4a22', '#d97a8c,#5c2a38', '#7fa3a0,#2c4644', '#c9b38a,#6b5a3a', '#9a6b5b,#3d2620'];
const names = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV'];
const months = names.map((label, i) => label === 'AUG'
? { label: 'AUG · TOP MONTH', tone: 'linear-gradient(150deg, ' + tones[i] + ')', ring: 'inset 0 0 0 3px #FF0069', chipBg: '#FF0069', chipInk: '#0B0B0D' }
: { label, tone: 'linear-gradient(150deg, ' + tones[i] + ')', ring: 'none', chipBg: '#FFFFFF', chipInk: '#0B0B0D' });
return { bars, months };
}
}
</script>
</body>
</html>
