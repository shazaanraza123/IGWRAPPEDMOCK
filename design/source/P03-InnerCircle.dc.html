<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your circle card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FF7A00; color: #0B0B0D; font-family: 'Archivo', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 50px 10px 0 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 3px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><div style="flex: 1; height: 3px; border-radius: 2px; background: {{b.fill}}"></div></sc-for></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px"><div style="width: 30px; height: 30px; border-radius: 50%; padding: 2px; box-sizing: border-box; background: #0B0B0D"><div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid #FF7A00; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">26</div></div><span style="font-size: 14px; font-weight: 800">Wrapped</span></div>
<div style="display: flex">
<button aria-label="About this card" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button>
<button aria-label="Mute music" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"></path><path d="M16.5 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; background: none; border: none; color: #0B0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 128px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1.4px">YOUR PEOPLE</div>
<h1 style="margin: 0; font-size: 72px; line-height: 0.86; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -1.5px">Your circle.</h1>
<div style="font-size: 16px; line-height: 1.3; font-weight: 600; max-width: 320px">The five accounts you showed up for most. No ranking, no scores.</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 328px; display: flex; flex-wrap: wrap; justify-content: center; column-gap: 18px; row-gap: 18px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="5">
<div style="width: 98px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 98px; height: 98px; border-radius: 50%; padding: 4px; box-sizing: border-box; background: conic-gradient(from 200deg, #FFD600, #FF0069, #D300C5, #7638FA, #0B0B0D, #FFD600)"><div style="width: 100%; height: 100%; border-radius: 50%; border: 4px solid #FF7A00; box-sizing: border-box; background: {{p.tone}}"></div></div>
<div style="font-size: 15px; font-weight: 800">{{p.handle}}</div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 646px; font-size: 14px; font-weight: 600; text-align: center">Want the ranked version? It lives in Privacy, off by default.</div>
<div style="position: absolute; left: -10px; top: 702px; display: flex; gap: 4px">
<sc-for list="{{band}}" as="s" hint-placeholder-count="13"><div style="width: 30px; height: 30px; border-radius: 4px; background: {{s.fill}}"></div></sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center">
<div style="display: flex; align-items: center; gap: 8px; background: #0B0B0D; color: #FFFFFF; border-radius: 999px; padding: 13px 18px; font-size: 14px; font-weight: 700">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Private card · only you see this
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({ length: 13 }, (_, i) => ({ fill: i <= 7 ? '#0B0B0D' : 'rgba(11,11,13,0.25)' }));
const people = [
{ handle: 'jules.mp', tone: 'linear-gradient(150deg, #5b7fa6, #243447)' },
{ handle: 'nico_k', tone: 'linear-gradient(150deg, #6b8a6a, #2c3b2b)' },
{ handle: 'dee.films', tone: 'linear-gradient(150deg, #c0617a, #3b1f3f)' },
{ handle: 'sam.wav', tone: 'linear-gradient(150deg, #b4835a, #5a3a24)' },
{ handle: 'tori.eats', tone: 'linear-gradient(150deg, #d8c3a5, #8a6f52)' }
];
const band = Array.from({ length: 13 }, (_, i) => ({ fill: i % 3 === 1 ? 'rgba(11,11,13,0.18)' : '#0B0B0D' }));
return { bars, people, band };
}
}
</script>
</body>
</html>
